[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mail-buddy"
version = "0.1.0"
description = "Private, local-first Gmail classification and sorting for macOS and Raspberry Pi"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Mail-Buddy contributors" }]
dependencies = [
  "argon2-cffi==23.1.0",
  "beautifulsoup4==4.13.4",
  "cryptography==45.0.4",
  "fastapi==0.115.14",
  "google-api-python-client==2.174.0",
  "google-auth==2.40.3",
  "google-auth-oauthlib==1.2.2",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "pypdf==5.6.1",
  "python-multipart==0.0.20",
  "uvicorn==0.34.3",
]

[project.optional-dependencies]
dev = [
  "pip-licenses==5.0.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.0.0",
  "respx==0.22.0",
  "ruff==0.12.1",
]

[project.scripts]
mail-buddy = "mail_buddy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_buddy"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
