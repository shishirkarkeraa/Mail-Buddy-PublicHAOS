name: mail-buddy

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: mail-buddy:0.1.0
  environment:
    MAIL_BUDDY_DATA_DIR: /data
    MAIL_BUDDY_BACKUP_DIR: /backups
    MAIL_BUDDY_OLLAMA_URL: http://ollama:11434
    MAIL_BUDDY_OLLAMA_PRIMARY_URL: ${MAIL_BUDDY_OLLAMA_PRIMARY_URL:-}
    MAIL_BUDDY_ENCRYPTION_KEY_FILE: /run/mail-buddy-secrets/encryption_key
    MAIL_BUDDY_SESSION_SECRET_FILE: /run/mail-buddy-secrets/session_secret
    MAIL_BUDDY_PASSWORD_HASH_FILE: /run/mail-buddy-secrets/password_hash
    MAIL_BUDDY_GOOGLE_CLIENT_SECRET_PATH: /run/mail-buddy-secrets/google_client_secret
    MAIL_BUDDY_SECURE_COOKIES: "true"
    MAIL_BUDDY_ENVIRONMENT: production
  env_file:
    - path: .env
      required: false
  volumes:
    - mail_buddy_data:/data
    - mail_buddy_backups:/backups
    - mail_buddy_runtime_secrets:/run/mail-buddy-secrets:ro
    - ./models:/models:ro
  init: true
  restart: "no"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  # Compose cannot portably apply uid/gid/mode to file-backed secrets. Import
  # them into a private named volume so the non-root app can read identical
  # mode-0400 files on Linux hosts and Docker Desktop for macOS.
  secret-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: mail-buddy:0.1.0
    user: "0:0"
    entrypoint: ["/bin/sh", "/import-runtime-secrets.sh"]
    volumes:
      - mail_buddy_runtime_secrets:/runtime-secrets
      - ./scripts/import-runtime-secrets.sh:/import-runtime-secrets.sh:ro
    secrets:
      - encryption_key
      - session_secret
      - password_hash
      - google_client_secret
    network_mode: "none"
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    # Required only while normalizing ownership in the isolated secret volume.
    # The importer has no network and the application never receives these.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32

  app:
    <<: *app-base
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
    networks:
      - backend
      - edge
    depends_on:
      secret-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    mem_limit: 1400m
    cpus: 2.0
    pids_limit: 256

  auth:
    <<: *app-base
    profiles: ["auth"]
    command:
      - mail-buddy
      - auth
      - --bind
      - 0.0.0.0
      - --redirect-host
      - 127.0.0.1
      - --port
      - "8765"
    # Publishing only on host loopback works on Raspberry Pi Docker Engine and
    # Docker Desktop without depending on host-network support.
    ports:
      - "127.0.0.1:8765:8765/tcp"
    networks:
      - oauth
    depends_on:
      secret-init:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

  ollama:
    image: ollama/ollama:0.9.3@sha256:45008241d61056449dd4f20cebf64bfa5a2168b0c078ecf34aa2779760502c2f
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama_models:/root/.ollama
      - ./models:/models:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 30s
    mem_limit: 5g
    cpus: 3.5
    pids_limit: 512
    security_opt:
      - no-new-privileges:true

  model-init:
    image: ollama/ollama:0.9.3@sha256:45008241d61056449dd4f20cebf64bfa5a2168b0c078ecf34aa2779760502c2f
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull "$${MAIL_BUDDY_MODEL}" &&
        sh /verify-model-manifest.sh &&
        ollama show "$${MAIL_BUDDY_MODEL}"
    environment:
      OLLAMA_HOST: http://ollama:11434
      MAIL_BUDDY_MODEL: llama3.2:3b-instruct-q4_K_M
      MAIL_BUDDY_MODEL_MANIFEST_SHA256: sha256:a80c4f17acd55265feec403c7aef86be0c25983ab279d83f3bcd3abbcb5b8b72
    volumes:
      - ollama_models:/root/.ollama:ro
      - ./scripts/verify-model-manifest.sh:/verify-model-manifest.sh:ro
    networks:
      - backend
    depends_on:
      ollama:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    restart: unless-stopped
    environment:
      MAIL_BUDDY_HOSTNAME: ${MAIL_BUDDY_HOSTNAME:-mail-buddy.local}
    ports:
      - "${MAIL_BUDDY_BIND_ADDRESS:-127.0.0.1}:443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge
  oauth:
    driver: bridge

volumes:
  mail_buddy_data:
    driver: local
  mail_buddy_backups:
    driver: local
  ollama_models:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  mail_buddy_runtime_secrets:
    driver: local

secrets:
  encryption_key:
    file: ${MAIL_BUDDY_SECRETS_DIR:-./secrets}/encryption_key
  session_secret:
    file: ${MAIL_BUDDY_SECRETS_DIR:-./secrets}/session_secret
  password_hash:
    file: ${MAIL_BUDDY_SECRETS_DIR:-./secrets}/password_hash
  google_client_secret:
    file: ${MAIL_BUDDY_SECRETS_DIR:-./secrets}/google_client_secret.json
