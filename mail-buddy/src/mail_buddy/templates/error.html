{% extends "base.html" %}
{% block content %}
<section class="empty-state hero-empty error-state">
  <span>!</span>
  <div><p class="eyebrow">Request {{ status_code }}</p><h1>Mail-Buddy could not do that</h1><p>{{ message }}</p><a class="button secondary" href="{{ ingress_url('/') }}">Return to overview</a></div>
</section>
{% endblock %}
{% block public_content %}
<main class="standalone-error" id="main-content"><section class="empty-state hero-empty error-state"><span>!</span><div><p class="eyebrow">Request {{ status_code }}</p><h1>Mail-Buddy could not do that</h1><p>{{ message }}</p><a class="button secondary" href="{{ ingress_url('/login') }}">Return to sign in</a></div></section></main>
{% endblock %}
